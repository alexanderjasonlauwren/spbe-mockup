name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every check this repository has, run on every change.
  #
  # Split from the deploy job rather than sitting above it as extra steps, so
  # the checks still run and still report when the Vercel secrets are missing —
  # on a fork, or before the project is linked. As steps in the deploy job they
  # were reported as "deploy failed", which reads as an infrastructure problem
  # rather than a broken build.
  check:
    name: Type check, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Was missing, and that is why thirteen lint errors accumulated
      # unnoticed: `npm run lint` existed and nothing ran it. A standard
      # nothing enforces is a suggestion.
      - name: Lint
        run: npm run lint

      # The console had no test framework at all until 2026-08-29 — not few
      # tests, none — so this step and the suite behind it arrived together.
      # Wired into CI on the first day for the reason the lint step above
      # exists: a check nothing runs is a check that stops being true.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build API-backed image assets
        run: npm run build
        env:
          VITE_DATA_SOURCE: api
          VITE_API_URL: /api/v1

  deploy:
    name: Deploy
    needs: check
    # Vercel's GitHub integration already creates previews. Keep the duplicate
    # CLI deployment disabled unless the repository is deliberately configured
    # with both this variable and the Vercel secrets below.
    if: ${{ vars.VERCEL_CLI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview on PR, production on main)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
